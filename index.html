<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHAIN SENTINEL | MHA VASP Attribution Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script crossorigin src="https://unpkg.com/react-is@18.2.0/umd/react-is.production.min.js"></script>
<script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  html, body { background:#0A0E14; color:#CBD5E1; font-family:Inter, system-ui, sans-serif; }
  .mono { font-family:'JetBrains Mono', ui-monospace, monospace; }
  .panel { background:#0F141C; border:1px solid #1E2733; }
  .lbl { font-size:12px; color:#64748B; }
  .gridbg { background-image:linear-gradient(#131A24 1px, transparent 1px), linear-gradient(90deg, #131A24 1px, transparent 1px); background-size:32px 32px; }
  .flow { stroke-dasharray:6 6; animation:dash .6s linear infinite; }
  @keyframes dash { to { stroke-dashoffset:-12; } }
  .ring { transform-box:fill-box; transform-origin:center; animation:ring 1.4s ease-out infinite; }
  @keyframes ring { from { transform:scale(1); opacity:.7; } to { transform:scale(2.4); opacity:0; } }
  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-thumb { background:#1E2733; }
  input:focus-visible, button:focus-visible { outline:2px solid #22D3EE; outline-offset:2px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const RC = window.Recharts || null;

const CYAN = '#22D3EE';
const RED = '#EF4444';
const DEMO_WALLET = 'bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh';

const short = (w) => (w.length > 16 ? w.slice(0, 8) + '…' + w.slice(-6) : w);
const hexPts = (cx, cy, r) =>
  [0, 1, 2, 3, 4, 5]
    .map((i) => {
      const a = (Math.PI / 3) * i;
      return (cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1);
    })
    .join(' ');

/* ---------- Confidence gauge ---------- */
function Gauge({ status }) {
  const [v, setV] = useState(0);
  useEffect(() => {
    if (status !== 'complete') { setV(0); return; }
    let raf, start = null;
    const step = (t) => {
      if (start === null) start = t;
      const p = Math.min((t - start) / 1800, 1);
      setV(94.2 * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [status]);
  const C = 2 * Math.PI * 52;
  return (
    <svg viewBox="0 0 140 140" className="w-40 h-40 mx-auto" role="img" aria-label="Confidence gauge">
      <circle cx="70" cy="70" r="52" fill="none" stroke="#1E2733" strokeWidth="10" />
      <circle cx="70" cy="70" r="52" fill="none" stroke={CYAN} strokeWidth="10" strokeLinecap="round"
        strokeDasharray={C} strokeDashoffset={C * (1 - v / 100)} transform="rotate(-90 70 70)"
        style={{ filter: v > 0 ? 'drop-shadow(0 0 6px rgba(34,211,238,.7))' : 'none' }} />
      <text x="70" y="72" textAnchor="middle" fill="#F1F5F9" fontSize="26" fontWeight="600" className="mono">{v.toFixed(1)}%</text>
      <text x="70" y="92" textAnchor="middle" fill="#64748B" fontSize="9">Attribution confidence</text>
    </svg>
  );
}

/* ---------- Custom SVG network graph ---------- */
function Graph({ status, wallet }) {
  const S = { x: 120, y: 210 };
  const B = { x: 670, y: 210 };
  const I = [60, 150, 270, 360].map((y, i) => ({ x: 390, y, n: 'Hop ' + (i + 1) }));
  const done = status === 'complete';
  const busy = status === 'tracing';
  const edge = (colorDone) => ({
    stroke: done ? colorDone : busy ? CYAN : '#2A3644',
    strokeWidth: done ? 3.5 : 1.5,
    opacity: busy ? 0.6 : 1,
    transition: 'stroke .6s, stroke-width .6s',
  });
  return (
    <svg viewBox="0 0 800 420" className="w-full h-auto block" role="img" aria-label="Wallet network graph">
      <defs>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="3.5" result="b" />
          <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
      </defs>
      {I.map((n, i) => (
        <line key={'a' + i} x1={S.x} y1={S.y} x2={n.x} y2={n.y} className={busy ? 'flow' : ''}
          style={edge(RED)} filter={done ? 'url(#glow)' : undefined} />
      ))}
      {I.map((n, i) => (
        <line key={'b' + i} x1={n.x} y1={n.y} x2={B.x} y2={B.y} className={busy ? 'flow' : ''}
          style={edge(CYAN)} filter={done ? 'url(#glow)' : undefined} />
      ))}
      {busy && <circle className="ring" cx={S.x} cy={S.y} r="26" fill="none" stroke={RED} strokeWidth="2" />}
      <circle cx={S.x} cy={S.y} r="26" fill="#3B0D0D" stroke={RED} strokeWidth="3" filter={done ? 'url(#glow)' : undefined} />
      <circle cx={S.x} cy={S.y} r="8" fill={RED} />
      <text x={S.x} y={S.y + 52} textAnchor="middle" fill="#F87171" fontSize="13" fontWeight="600">Suspect wallet</text>
      <text x={S.x} y={S.y + 69} textAnchor="middle" fill="#94A3B8" fontSize="11" className="mono">{short(wallet.trim() || 'not set')}</text>
      {I.map((n, i) => (
        <g key={'n' + i}>
          <circle cx={n.x} cy={n.y} r="14" fill="#1B232E" stroke={done ? '#94A3B8' : '#475569'} strokeWidth="2" />
          <text x={n.x} y={n.y - 24} textAnchor="middle" fill="#94A3B8" fontSize="11">{n.n}</text>
        </g>
      ))}
      <polygon points={hexPts(B.x, B.y, 50)} fill="#062B33" stroke={CYAN} strokeWidth={done ? 4 : 2.5}
        filter={done ? 'url(#glow)' : undefined} style={{ transition: 'stroke-width .6s' }} />
      <polygon points={hexPts(B.x, B.y, 30)} fill="none" stroke={CYAN} strokeWidth="1" opacity=".5" />
      <text x={B.x} y={B.y + 5} textAnchor="middle" fill={CYAN} fontSize="14" fontWeight="700">BNB</text>
      <text x={B.x} y={B.y + 74} textAnchor="middle" fill="#67E8F9" fontSize="13" fontWeight="600">Target VASP: Binance</text>
      <text x={B.x} y={B.y + 91} textAnchor="middle" fill="#94A3B8" fontSize="11">{done ? 'Attributed at 94.2%' : 'Unresolved'}</text>
      <text x="390" y="410" textAnchor="middle" fill="#64748B" fontSize="11">Intermediary nodes: 4</text>
    </svg>
  );
}

/* ---------- Feature contribution chart ---------- */
function Contrib({ on }) {
  if (!RC) return <div className="text-xs text-slate-500">Chart library did not load. Check your connection and reload.</div>;
  const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer } = RC;
  const data = [
    { name: 'Sweep Match', value: on ? 85 : 0 },
    { name: 'Volume Share', value: on ? 60 : 0 },
  ];
  return (
    <div style={{ height: 170 }}>
      <ResponsiveContainer width="100%" height="100%">
        <BarChart data={data} margin={{ top: 8, right: 8, left: -22, bottom: 0 }}>
          <XAxis dataKey="name" tick={{ fill: '#94A3B8', fontSize: 11 }} axisLine={{ stroke: '#1E2733' }} tickLine={false} />
          <YAxis domain={[0, 100]} tick={{ fill: '#64748B', fontSize: 10 }} axisLine={false} tickLine={false} />
          <Tooltip cursor={{ fill: '#1E2733' }} contentStyle={{ background: '#0A0E14', border: '1px solid #1E2733', fontSize: 12 }}
            labelStyle={{ color: '#CBD5E1' }} itemStyle={{ color: CYAN }} />
          <Bar dataKey="value" fill={CYAN} radius={[3, 3, 0, 0]} maxBarSize={52} />
        </BarChart>
      </ResponsiveContainer>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [tracingStatus, setTracingStatus] = useState('idle');
  const [wallet, setWallet] = useState(DEMO_WALLET);
  const [lines, setLines] = useState(['> Sentinel core online. Awaiting suspect wallet.']);
  const termRef = useRef(null);
  const add = (l) => setLines((p) => [...p, l]);

  useEffect(() => {
    if (tracingStatus !== 'tracing') return;
    const t = [
      setTimeout(() => add('> Parsing UTXO...'), 300),
      setTimeout(() => add('> Tracing cross-chain...'), 1300),
      setTimeout(() => add('> VASP identified..'), 2300),
      setTimeout(() => {
        add('> Attribution complete: Binance Hot Wallet, 94.2% confidence.');
        setTracingStatus('complete');
      }, 3000),
    ];
    return () => t.forEach(clearTimeout);
  }, [tracingStatus]);

  useEffect(() => {
    if (termRef.current) termRef.current.scrollTop = termRef.current.scrollHeight;
  }, [lines]);

  const start = () => {
    if (tracingStatus === 'tracing') return;
    if (!wallet.trim()) { add('> ERROR: enter a BTC or ETH wallet address.'); return; }
    setLines(['> Case SIH26182 opened. Target: ' + wallet.trim()]);
    setTracingStatus('tracing');
  };

  const done = tracingStatus === 'complete';
  const busy = tracingStatus === 'tracing';
  const chain = /^0x/i.test(wallet.trim()) ? 'ETH' : 'BTC';
  const chip = done ? ['Trace complete', 'text-cyan-300 border-cyan-500/50'] : busy ? ['Tracing…', 'text-amber-300 border-amber-500/50'] : ['Idle', 'text-slate-400 border-slate-600'];

  return (
    <div className="min-h-screen flex flex-col">
      <div className="mono text-center text-[11px] font-medium tracking-widest py-1 bg-red-950/60 text-red-400 border-b border-red-900/60">
        RESTRICTED - DEMO DATA ONLY
      </div>

      <header className="panel border-x-0 border-t-0 flex flex-wrap items-center justify-between gap-3 px-4 py-3">
        <div className="flex items-center gap-3">
          <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
            <polygon points={hexPts(14, 14, 12)} fill="none" stroke={CYAN} strokeWidth="2" />
            <circle cx="14" cy="14" r="3.5" fill={CYAN} />
          </svg>
          <div>
            <h1 className="text-[16px] font-semibold text-slate-100 leading-tight">MHA VASP Attribution Engine</h1>
            <div className="text-[12px] text-slate-500">Chain Sentinel, project SIH26182</div>
          </div>
        </div>
        <div className="flex items-center gap-2 mono text-[11px] text-emerald-400">
          <span className="relative flex h-2.5 w-2.5">
            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
          </span>
          LIVE NODE SYNC
        </div>
      </header>

      <main className="grid grid-cols-1 lg:grid-cols-[280px_minmax(0,1fr)_300px] gap-3 p-3">
        {/* Left: controls */}
        <section className="panel p-4 flex flex-col gap-4">
          <div>
            <label htmlFor="wallet" className="lbl block mb-1.5">Enter Suspect Wallet (BTC/ETH)</label>
            <input id="wallet" value={wallet} onChange={(e) => setWallet(e.target.value)} spellCheck="false"
              placeholder="bc1q… or 0x…" disabled={busy}
              className="mono w-full text-[12px] px-3 py-2 rounded bg-[#0A0E14] border border-[#1E2733] text-slate-200 placeholder-slate-600 focus:border-cyan-400 disabled:opacity-60" />
            <div className="mono text-[11px] text-slate-500 mt-1.5">Detected chain: {chain}</div>
          </div>
          <button onClick={start} disabled={busy}
            className="w-full py-2.5 rounded text-[13px] font-semibold bg-cyan-400 text-[#04222A] hover:bg-cyan-300 disabled:bg-cyan-900 disabled:text-cyan-300 transition-colors">
            {busy ? 'Tracing…' : 'Initiate Heuristic Trace'}
          </button>
          <div className="border-t border-[#1E2733] pt-4">
            <Gauge status={tracingStatus} />
          </div>
          <dl className="text-[12px] grid grid-cols-2 gap-y-1.5">
            <dt className="text-slate-500">Status</dt><dd className="text-right mono text-slate-300">{tracingStatus}</dd>
            <dt className="text-slate-500">Hops traced</dt><dd className="text-right mono text-slate-300">{done ? '4' : busy ? '…' : '0'}</dd>
            <dt className="text-slate-500">Heuristics</dt><dd className="text-right mono text-slate-300">Sweep, volume</dd>
          </dl>
        </section>

        {/* Center: network graph */}
        <section className="panel flex flex-col min-w-0">
          <div className="flex items-center justify-between px-4 py-2.5 border-b border-[#1E2733]">
            <h2 className="text-[13px] font-semibold text-slate-200">Transaction network</h2>
            <span className={'mono text-[11px] px-2 py-0.5 rounded border ' + chip[1]}>{chip[0]}</span>
          </div>
          <div className="gridbg p-2 flex-1 flex items-center">
            <Graph status={tracingStatus} wallet={wallet} />
          </div>
          <div className="flex flex-wrap gap-x-5 gap-y-1 px-4 py-2 border-t border-[#1E2733] text-[11px] text-slate-500">
            <span><i className="inline-block w-2.5 h-2.5 rounded-full mr-1.5" style={{ background: RED }}></i>Suspect wallet</span>
            <span><i className="inline-block w-2.5 h-2.5 rounded-full mr-1.5 bg-slate-500"></i>Intermediary node</span>
            <span><i className="inline-block w-2.5 h-2.5 mr-1.5" style={{ background: CYAN, clipPath: 'polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)' }}></i>Target VASP</span>
          </div>
        </section>

        {/* Right: attribution */}
        <section className="panel p-4 flex flex-col gap-4">
          <div>
            <h2 className="text-[13px] font-semibold text-slate-200 mb-2">Attribution ranking</h2>
            <ol className={'flex flex-col gap-2 transition-opacity duration-500 ' + (done ? 'opacity-100' : 'opacity-40')}>
              <li className="rounded border border-cyan-500/40 bg-cyan-950/30 px-3 py-2">
                <div className="text-[13px] text-cyan-200">1. Binance Hot Wallet (94.2%)</div>
                <div className="h-1 mt-1.5 bg-[#1E2733] rounded"><div className="h-1 rounded bg-cyan-400 transition-all duration-1000" style={{ width: done ? '94.2%' : '0%' }}></div></div>
              </li>
              <li className="rounded border border-[#1E2733] px-3 py-2">
                <div className="text-[13px] text-slate-300">2. Huobi (2.1%)</div>
                <div className="h-1 mt-1.5 bg-[#1E2733] rounded"><div className="h-1 rounded bg-slate-500 transition-all duration-1000" style={{ width: done ? '2.1%' : '0%' }}></div></div>
              </li>
            </ol>
            {!done && <p className="text-[11px] text-slate-500 mt-2">Run a trace to populate the ranking.</p>}
          </div>
          <div>
            <h2 className="text-[13px] font-semibold text-slate-200 mb-2">Feature contributions</h2>
            <Contrib on={done} />
          </div>
        </section>
      </main>

      {/* Bottom: terminal + SAHYOG */}
      <section className="grid grid-cols-1 md:grid-cols-2 gap-3 px-3 pb-3">
        <div className="panel flex flex-col">
          <div className="px-4 py-2 border-b border-[#1E2733] text-[13px] font-semibold text-slate-200">Trace terminal</div>
          <div ref={termRef} className="mono bg-black text-green-400 text-[12px] leading-relaxed p-3 h-44 overflow-y-auto">
            {lines.map((l, i) => <div key={i}>{l}</div>)}
            <span className="animate-pulse">▌</span>
          </div>
        </div>
        <div className="panel flex flex-col">
          <div className="px-4 py-2 border-b border-[#1E2733] text-[13px] font-semibold text-slate-200">SAHYOG draft</div>
          <div className="p-4 flex flex-col gap-3 flex-1">
            <div className="flex items-center justify-between">
              <span className="text-[13px] text-slate-300">Legal Notice Status: <span className="mono text-amber-400">DRAFT</span></span>
              <span className="mono text-[11px] text-slate-500">Ref SIH26182/D-001</span>
            </div>
            <dl className="text-[12px] grid grid-cols-[110px_1fr] gap-y-1.5">
              <dt className="text-slate-500">Addressed to</dt><dd className="text-slate-300">{done ? 'Binance, compliance officer' : 'Pending trace result'}</dd>
              <dt className="text-slate-500">Subject wallet</dt><dd className="mono text-slate-300 break-all">{wallet.trim() ? short(wallet.trim()) : 'not set'}</dd>
              <dt className="text-slate-500">Basis</dt><dd className="text-slate-300">{done ? 'Heuristic attribution at 94.2%' : 'Awaiting attribution'}</dd>
            </dl>
            <button disabled className="mt-auto self-start px-4 py-2 rounded text-[13px] font-semibold bg-[#1E2733] text-slate-500 cursor-not-allowed">
              Send Request
            </button>
          </div>
        </div>
      </section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
